  <text x="1040" y="602" fill="#C7D2FE" font-family="Arial, sans-serif" font-size="18">Reply to a blocked Codex session</text>
  <text x="1040" y="632" fill="#C7D2FE" font-family="Arial, sans-serif" font-size="18">without SSH or remote desktop.</text>

  <defs>
