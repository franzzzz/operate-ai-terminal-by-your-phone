name: Bug report
description: Report a reproducible bug in setup, routing, session handling, or Telegram behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Briefly describe the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest possible reproduction path.
      placeholder: |
        1. Start the controller
        2. Open a session topic
        3. Press Continue
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Include OS, Python version, Telegram setup shape, and whether mirroring or forum topics are involved.
      placeholder: |
        OS:
        Python:
        Session type:
        Forum enabled:
        Mirror enabled:

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the relevant lines. Remove secrets before posting.
