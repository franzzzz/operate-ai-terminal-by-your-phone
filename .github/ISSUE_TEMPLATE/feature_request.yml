name: Feature request
description: Suggest an improvement to the mobile control-console workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or workflow you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If you already tried another approach, describe it here.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, example Telegram layouts, or operator notes if useful.
